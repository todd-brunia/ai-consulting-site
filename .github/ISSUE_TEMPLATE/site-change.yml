name: Website change
description: Propose a visitor-facing content, design, or behavior change
title: "[Website]: "
labels:
  - needs-planning
  - website
body:
  - type: markdown
    attributes:
      value: |
        Describe the visitor or business need. AI will propose a plan before any code changes begin.

  - type: dropdown
    id: change-type
    attributes:
      label: Change type
      options:
        - Content
        - Visual design
        - New section
        - Bug
        - Accessibility
        - Performance
        - SEO
        - Experiment
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is not working or what could be improved?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the visitor behavior or business result you want.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Initial idea
      description: Describe a possible solution, if one is already in mind.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this issue to be complete?

  - type: textarea
    id: constraints
    attributes:
      label: Constraints or risks
      description: Note factual, accessibility, responsive, timing, or scope constraints.

  - type: textarea
    id: supporting-context
    attributes:
      label: Supporting context
      description: Add relevant links, screenshots, examples, analytics, or other evidence.
